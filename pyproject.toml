[project]
name = "splat2mc"
version = "0.1.0"
description = "Convert 3D Gaussian Splats to Minecraft particle datapacks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "plyfile>=1.0.0",
    "click>=8.0.0",
    "pillow>=12.3.0",
    "scipy>=1.15.3",
    "scikit-image>=0.25.2",
    "numba>=0.68.1",
    "trimesh>=5.2.1",
    "fast-simplification>=0.2.0",
]

[project.scripts]
splat2mc = "splat2mc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splat2mc"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]
